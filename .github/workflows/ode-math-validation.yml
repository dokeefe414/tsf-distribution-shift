name: Controlled ODE and Mathematical Validation

on:
  push:
    paths:
      - "code/controlled_ode_framework.py"
      - "code/ode_sensitivity.py"
      - "code/run_controlled_ode.py"
      - "code/run_sensitivity_validation.py"
      - "code/test_controlled_ode.py"
      - "code/test_ode_sensitivity.py"
      - "requirements-ode.txt"
      - ".github/workflows/ode-math-validation.yml"
  pull_request:
    paths:
      - "code/controlled_ode_framework.py"
      - "code/ode_sensitivity.py"
      - "code/run_controlled_ode.py"
      - "code/run_sensitivity_validation.py"
      - "code/test_controlled_ode.py"
      - "code/test_ode_sensitivity.py"
      - "requirements-ode.txt"
      - ".github/workflows/ode-math-validation.yml"
  workflow_dispatch:

jobs:
  math-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal ODE requirements
        run: python -m pip install -r requirements-ode.txt
      - name: Original controlled ODE tests
        run: python -m unittest discover -s code -p "test_controlled_ode.py" -v
      - name: Mathematical sensitivity tests
        run: python -m unittest discover -s code -p "test_ode_sensitivity.py" -v
      - name: Execute controlled ODE integration
        run: python code/run_controlled_ode.py
      - name: Execute numerical validation smoke test
        run: python code/run_sensitivity_validation.py --seeds 4 --bootstrap 50 --epsilon 0.04
